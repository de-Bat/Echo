<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Example Product Page</title>
</head>
<body>
    <header>
        <h1>Our Example Shop</h1>
    </header>
    <main>
        <article class="product">
            <h1 class="product-title">Awesome Gadget X</h1>
            <section class="pricing">
                <span class="currency-symbol">$</span>
                <span class="price-value">299.99</span>
                <p>Shipping: <span class="shipping-cost">$15.50</span></p>
            </section>
            <section class="description">
                <p>This is the best gadget ever. You really need it.</p>
            </section>
            <section class="availability">
                <span class="stock-status">In Stock</span>
            </section>
        </article>
    </main>
    <footer>
        <p>&copy; 2023 Example Shop Inc.</p>
    </footer>
</body>
</html>
